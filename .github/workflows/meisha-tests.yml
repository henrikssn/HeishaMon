name: Meisha Controller Tests

on:
  push:
    branches:
      - '**'
    paths:
      - 'HeishaMon/meisha.*'
      - 'HeishaMon/HeishaMon.ino'
      - 'tests/**'
      - '.github/workflows/meisha-tests.yml'
  pull_request:
    paths:
      - 'HeishaMon/meisha.*'
      - 'HeishaMon/HeishaMon.ino'
      - 'tests/**'
      - '.github/workflows/meisha-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and run MeishaController unit tests
        run: |
          make clean
          make test
        shell: bash
